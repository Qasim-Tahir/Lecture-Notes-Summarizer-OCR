[project]
name = "pdf-lecture-notes-generator"
version = "0.1.0"
description = "Convert PDF lecture slides to structured notes and Q&A using OCR and LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdf2image>=1.16.0",
    "groq>=0.4.0",
    "Pillow>=10.0.0",
    "dotenv>=0.9.9",
    "pypdf2>=3.0.1",
    "yt-dlp>=2026.3.17",
    "moviepy>=2.2.1",
    "whisper>=1.1.10",
    "playwright>=1.50.0",
]
